<!DOCTYPE html>
<html>

<head>
<style>.hide {display: none;}
    .show {display: block;}</style>
    
</head>

<body>
        <div>
            <button onclick="func('all')">Show all</button>
            <button onclick="func('Markup')">Markup</button>
            <button onclick="func('Style')">Style</button>
            <button onclick="func('Scripting')">Scripting</button>
        </div>
            <div class="hide Markup">
                <p>HTML</p>
            </div>
            <div class="hide Styleshit">
                <p>CSS</p>
            </div>
            <div class="hide Scripting">
                <p>PHP</p>
            </div>
            <div class="hide Scripting">
                <p>Javascript</p>
            </div>

    <script>
    func("all")
        function func(c) {
            let x, i;
            x = document.getElementsByClassName("hide");
            if (c == "all") c = "";
            for (i = 0; i < x.length; i++) {
                RemoveClass(x[i], "show");
                if (x[i].className.indexOf(c) > -1) AddClass(x[i], "show");}}
        
        function AddClass(element, name) {
            let i, arr1, arr2;
            arr1 = element.className.split(" ");
            arr2 = name.split(" ");
            for (i = 0; i < arr2.length; i++) {
                if (arr1.indexOf(arr2[i]) == -1) {element.className += " " + arr2[i];}}}
        
        function RemoveClass(element, name) {
            let i, arr1, arr2;
            arr1 = element.className.split(" ");
            arr2 = name.split(" ");
            for (i = 0; i < arr2.length; i++) {
                while (arr1.indexOf(arr2[i]) > -1) {arr1.splice(arr1.indexOf(arr2[i]), 1);}}
            element.className = arr1.join(" ");}

                let current = document.getElementsByClassName("active");

                this.className += " active"})}
        </script>
</body>

</html>
